name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: node scripts/build.mjs

      - name: Test the qr encoder
        run: node scripts/test-qr.mjs

      - name: Test the password generator
        run: node scripts/test-password.mjs
